<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      type="image/x-icon"
    />
    <link

      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/203f7bcb2a.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="budget.css" />
  </head>

  <body>
    <div class="rounded-container">
      <!-- 🔹 Navbar -->
      <nav class="navbar navbar-expand-lg container-fluid sticky-top">
        <div class="navbar-container">
          <a class="nav-logo text-decoration-none fs-4" href="index.html">
            <img
              src="https://raw.githubusercontent.com/Zetcor/Saveior/main/boink.png"
              alt="Logo"
            />
            Saveior
          </a>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div
            class="collapse navbar-collapse justify-content-center"
            id="navbarSupportedContent"
          >
            <ul
              class="nav flex-lg-row flex-column text-center gap-3 navbar-container"
            >
              <li class="nav-item">
                <a class="nav-link text-light px-4" href="index.html">Dashboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-light px-4" href="records.html">Records</a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-4 active" href="budget.html">Budgets</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-light px-4" href="accounts.html">Accounts</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-light px-4" href="categories.html">Categories</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-light px-4" href="savings.html">Savings</a>
              </li>
            </ul>
          </div>
          <div class="ms-lg-auto mt-2 mt-lg-0">
            <div
              class="d-flex flex-column flex-lg-row justify-content-center justify-content-lg-end text-center"
            >
              <button class="icon-btn d-none d-lg-flex">
                <i class="fa-solid fa-gear"></i>
              </button>
              <button class="icon-btn d-none d-lg-flex">
                <i class="fa-solid fa-user"></i>
              </button>
            </div>
          </div>
        </div>
      </nav>

	  <!-- Content -->
      <div class="tracker-container summary-container mt-3">
        <div
          class="summary p-3 mb-3 d-flex justify-content-around flex-wrap text-center"
        >
          <div class="text-dark">
            TOTAL BUDGET:
            <span id="total-budget" class="text-success">₱0</span>
          </div>
          <div class="text-dark">
            TOTAL SPENT:
            <span id="total-spent" class="text-danger">₱0</span>
          </div>
          <div class="text-dark">
            REMAINING:
            <span id="total-remaining" class="text-primary">₱0</span>
          </div>
        </div>
      </div>

      <!-- Budget Categories -->
      <div class="tracker-container mt-4">
        <div class="calculator-container" style="flex: 1 1 100%">
          <h4 class="fw-bold mb-3">Budgets</h4>

          <!-- Empty State -->
          <div id="emptyState" class="empty-state d-none mt-3 text-center text-muted">
            <div class="mb-1">
              <i class="bi bi-wallet2 fs-4"></i>
            </div>
            <div class="mb-2">
              No Categories yet. <br />
              <span class="text-dark fw-semibold">Tip:</span> Go to Categories to track budget.
            </div>
          </div>

          <!-- Categories List -->
          <div id="budgetList" class="row g-3"></div>
        </div>
      </div>
    </div>

    <!-- Edit Budget Modal -->
    <div class="modal fade" id="budgetModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <form id="budgetForm" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Set Budget Limit</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Category</label>
              <input type="text" class="form-control" id="budgetCategory" readonly />
            </div>
            <div class="mb-3">
              <label class="form-label">Budget Limit (₱)</label>
              <input
                type="number"
                min="0"
                step="0.01"
                class="form-control"
                id="budgetAmount"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" id="resetBudgetBtn">
              <i class="bi bi-arrow-counterclockwise"></i> Reset
            </button>
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-success" type="submit">
              <i class="bi bi-check2-circle"></i> Save
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const ACCOUNTS_KEY = "saveior.accounts";
      const BUDGETS_KEY = "saveior.budgets";
      const TRANSACTIONS_KEY = "saveior.transactions";
      const CATEGORIES_KEY = "saveior.categories";

      let budgets = JSON.parse(localStorage.getItem(BUDGETS_KEY) || "{}");

      function getTransactions() {
        return JSON.parse(localStorage.getItem(TRANSACTIONS_KEY) || "[]");
      }

      function getTotalAccountsBalance() {
        const accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || "[]");
        return accounts.reduce((sum, acc) => sum + Number(acc.balance || 0), 0);
      }

      function getExpenseCategories() {
        const stored = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || "{}");
        return stored.expense || [];
      }

      function calculateSpentByCategory() {
        const transactions = getTransactions();
        const spent = {};
        const expenseCategories = getExpenseCategories();
        expenseCategories.forEach((c) => (spent[c.name] = 0));

        transactions.forEach((tx) => {
          const category = tx.category || "";
          if (expenseCategories.some((c) => c.name === category) && tx.type === "expense") {
            spent[category] += Number(tx.amount || 0);
          }
        });
        return spent;
      }

      function renderBudgets() {
        const list = document.getElementById("budgetList");
        const emptyState = document.getElementById("emptyState");
        list.innerHTML = "";

        const expenseCategories = getExpenseCategories();

        // empty state
        if (expenseCategories.length === 0) {
          emptyState.classList.remove("d-none");
          return;
        } else {
          emptyState.classList.add("d-none");
        }

        const spent = calculateSpentByCategory();
        let totalBudget = 0;
        let totalSpent = 0;

        // budget cards
        expenseCategories.forEach((cat) => {
          const category = cat.name;
          const limit = Number(budgets[category] || 0);
          const used = Number(spent[category] || 0);
          const remaining = limit - used;

          totalBudget += limit;
          totalSpent += used;

          const remainingClass = remaining < 0 ? "text-danger fw-bold" : "text-primary";
          const pct = limit > 0 ? Math.min((used / limit) * 100, 100) : 0;
          const progressColor =
            pct >= 90 ? "bg-danger" : pct >= 70 ? "bg-warning" : "bg-success";

          const col = document.createElement("div");
          col.className = "col-12 col-md-6 col-lg-4";

          col.innerHTML = `
            <div class="goal-card p-3" style="cursor:pointer;" onclick="openEditBudget('${category}')">
              <div class="d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0">${category}</h5>
              </div>
              <hr>
              <div class="stats-2col mb-3">
                <div class="stat-label">Spent</div>
                <div class="stat-val text-danger">₱${used.toLocaleString()}</div>
                <div class="stat-label">Remaining</div>
                <div class="stat-val ${remainingClass}">₱${remaining.toLocaleString()}</div>
              </div>
              <div class="progress mb-2" style="height: 10px;">
                <div class="progress-bar ${progressColor}" role="progressbar" style="width: ${pct}%"></div>
              </div>
              <div class="d-flex justify-content-between small text-muted">
                <span>${pct.toFixed(1)}% used</span>
                <span>Limit: ₱${limit.toLocaleString()}</span>
              </div>
            </div>
          `;

          list.appendChild(col);
        });

        // update summary totals
        document.getElementById("total-budget").textContent =
          "₱" + totalBudget.toLocaleString();
        document.getElementById("total-spent").textContent =
          "₱" + totalSpent.toLocaleString();
        document.getElementById("total-remaining").textContent =
          "₱" + (totalBudget - totalSpent).toLocaleString();
      }

      // edit category budget
      function openEditBudget(category) {
        document.getElementById("budgetCategory").value = category;
        document.getElementById("budgetAmount").value = budgets[category] || 0;
        new bootstrap.Modal(document.getElementById("budgetModal")).show();
      }

      document
        .getElementById("budgetForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const category = document.getElementById("budgetCategory").value;
          const amount = parseFloat(document.getElementById("budgetAmount").value);
          const totalFunds = getTotalAccountsBalance();

          let currentTotalBudget = 0;
          for (const [cat, val] of Object.entries(budgets)) {
            if (cat !== category) currentTotalBudget += Number(val || 0);
          }

          if (currentTotalBudget + amount > totalFunds) {
            alert(
              `Your total budgets cannot exceed your available funds (₱${totalFunds.toLocaleString()}).`
            );
            return;
          }

          budgets[category] = amount;
          localStorage.setItem(BUDGETS_KEY, JSON.stringify(budgets));
          renderBudgets();
          bootstrap.Modal.getInstance(
            document.getElementById("budgetModal")
          ).hide();
        });

      document
        .getElementById("resetBudgetBtn")
        .addEventListener("click", () => {
          const category = document.getElementById("budgetCategory").value;
          if (!category) return;
          if (confirm(`Reset budget for ${category}?`)) {
            budgets[category] = 0;
            localStorage.setItem(BUDGETS_KEY, JSON.stringify(budgets));
            renderBudgets();
            bootstrap.Modal.getInstance(
              document.getElementById("budgetModal")
            ).hide();
          }
        });

      document.addEventListener("DOMContentLoaded", renderBudgets);
      window.addEventListener("storage", renderBudgets);
      window.addEventListener("focus", renderBudgets);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
