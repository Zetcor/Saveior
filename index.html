<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saveior | Dashboard</title>
  <link
    rel="icon"
    href="https://raw.githubusercontent.com/Zetcor/Saveior/main/boink.png"
    type="image/x-icon"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <script
    src="https://kit.fontawesome.com/203f7bcb2a.js"
    crossorigin="anonymous"
  ></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="rounded-container">
    <nav class="navbar navbar-expand-lg container-fluid sticky-top">
      <div class="navbar-container">
        <a class="nav-logo text-decoration-none fs-4" href="index.html">
          <img
            src="https://raw.githubusercontent.com/Zetcor/Saveior/main/boink.png"
            alt="Logo"
          />
          Saveior
        </a>
      </div>
      <button
        class="navbar-toggler d-lg-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="nav flex-lg-row flex-column text-center gap-3 navbar-container center-nav">
          <li class="nav-item">
            <a class="nav-link active px-4" href="index.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light px-4" href="records.html">Records</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light px-4" href="budget.html">Budgets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light px-4" href="accounts.html">Accounts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light px-4" href="categories.html">Categories</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light px-4" href="savings.html">Savings</a>
          </li>
        </ul>
        <div class="ms-lg-auto mt-2 mt-lg-0 right-actions">
          <div class="d-flex flex-column flex-lg-row justify-content-center justify-content-lg-end text-center align-items-center gap-2">
            <button class="icon-btn d-none d-lg-flex">
              <i class="fa-solid fa-gear"></i>
            </button>
            <button class="icon-btn d-none d-lg-flex">
              <i class="fa-solid fa-user"></i>
            </button>
            <button class="btn go-premium-btn d-none d-lg-flex align-items-center fw-semibold" id="goPremiumBtn">
              <i class="bi bi-star-fill me-2"></i> Go Premium
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="page-wrap">
      <div class="summary-row">
        <div class="sum-cell">
          <div id="sumIncome" class="sum-big sum-inc">₱0.00</div>
          <div class="sum-label">INCOME</div>
        </div>
        <div class="sum-cell">
          <div id="sumExpense" class="sum-big sum-exp">₱0.00</div>
          <div class="sum-label">EXPENSE</div>
        </div>
        <div class="sum-cell">
          <div id="sumTotal" class="sum-big sum-tot">₱0.00</div>
          <div class="sum-label">TOTAL</div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="panel">
          <h5>Goals</h5>
          <div id="goalsList"></div>
          <div class="mt-2">
            <a href="savings.html" class="btn btn-sm btn-success">
              <i class="bi bi-plus-circle"></i> Add a goal
            </a>
          </div>
        </div>

        <div class="tx-card">
          <div class="tx-head">
            <h5 class="m-0 fw-bold">Transactions</h5>
            <i class="bi bi-funnel"></i>
          </div>
          <div id="txList" class="tx-list"></div>
        </div>
      </div>

	        <!-- Budget Summary Section -->
      <div class="panel mt-3 mb-3">
        <h5>Budgets</h5>
        <div id="budgetList" class="row g-3"></div>
      </div>

    </div>
  </div>

  <script>
    const TRANSACTIONS_KEY = 'saveior.transactions';
    const GOALS_KEY = 'saveior.savings.goals';
    const BUDGETS_KEY = 'saveior.budgets';

    const fmt = (n) =>
      '₱' +
      Number(n || 0).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    const getJSON = (k, fallback) => {
      try {
        return JSON.parse(localStorage.getItem(k) || JSON.stringify(fallback));
      } catch {
        return fallback;
      }
    };

    function renderTransactions() {
      const mount = document.getElementById('txList');
      const txs = getJSON(TRANSACTIONS_KEY, []);
      if (!txs.length) {
        mount.innerHTML =
          '<div class="px-3 py-2 text-muted">No transactions yet.</div>';
        return;
      }
      const recent = txs.slice(-5).reverse();
      mount.innerHTML = recent
        .map(
          (tx) => `
        <div class="tx-item">
          <div class="tx-left">
            <div class="tx-cat">${tx.category || '—'}</div>
            <div class="tx-date">${new Date(tx.date).toLocaleDateString(
            'en-PH',
            { day: '2-digit', month: 'short', year: 'numeric' }
          )}</div>
          </div>
          <div class="tx-amt ${tx.type}">
            ${tx.type === 'expense' ? '-' + fmt(tx.amount) : tx.type === 'income' ? '+' + fmt(tx.amount) : fmt(tx.amount)}
          </div>
        </div>
      `
        )
        .join('');
    }

    function renderGoals() {
      const mount = document.getElementById('goalsList');
      const goals = getJSON(GOALS_KEY, []);
      if (!goals.length) {
        mount.innerHTML = '<div class="text-muted">No goals yet.</div>';
        return;
      }
      mount.innerHTML = goals
        .map((g) => {
          const saved = (g.savings || []).reduce(
            (a, s) => a + Number(s.amount || 0),
            0
          );
          const pct = Math.min(
            100,
            Math.round((saved / Math.max(1, g.targetAmount)) * 100)
          );
          return `
          <div class="goal-card">
            <div class="goal-top">
              <div class="goal-name">${g.name}</div>
              <div class="fw-bold">${pct}%</div>
            </div>
            <div class="goal-progress"><span style="width:${pct}%"></span></div>
            <div class="small mt-1"><span class="text-muted me-1">Saved</span>${fmt(saved)} / ${fmt(g.targetAmount)}</div>
          </div>`;
        })
        .join('');
    }

    // Budget Cards Rendering
    function renderBudgets() {
  const mount = document.getElementById('budgetList');
  const budgets = getJSON(BUDGETS_KEY, {});
  const expenseCategories = getJSON('saveior.categories', {}).expense || [];
  mount.innerHTML = '';
  let totalBudget = 0;
  let totalSpent = 0;

  // Limit to first 3 categories
  const limitedCategories = expenseCategories.slice(0, 3);

  limitedCategories.forEach((cat) => {
    const limit = budgets[cat.name] || 0;
    const spent = calculateSpentByCategory(cat.name);
    const remaining = limit - spent;

    totalBudget += limit;
    totalSpent += spent;

    const pct = Math.min(100, (spent / limit) * 100);
    const progressColor =
      pct >= 90 ? 'bg-danger' : pct >= 70 ? 'bg-warning' : 'bg-success';

    mount.innerHTML += `
    <div class="col-12 col-md-6 col-lg-4">
      <div class="goal-card p-3">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="fw-bold mb-0">${cat.name}</h5>
        </div>
        <div class="stats-2col mb-3">
          <div class="stat-label">Spent</div>
          <div class="stat-val text-danger">₱${spent.toLocaleString()}</div>
          <div class="stat-label">Remaining</div>
          <div class="stat-val text-primary">₱${remaining.toLocaleString()}</div>
        </div>
        <div class="progress mb-2" style="height: 10px;">
          <div class="progress-bar ${progressColor}" role="progressbar" style="width: ${pct}%"></div>
        </div>
      </div>
    </div>`;
  });

  // Add "Set Budget" button at the bottom of the entire goals section
  mount.innerHTML += `
    <div class="col-12">
      <div class="d-flex justify-content-center mt-3">
        <a href="budget.html?category=General" class="btn btn-sm btn-primary">
          <i class="bi bi-gear"></i> Set Budget
        </a>
      </div>
    </div>`;

  document.getElementById('sumIncome').textContent = fmt(totalBudget);
  document.getElementById('sumExpense').textContent = fmt(totalSpent);
  document.getElementById('sumTotal').textContent = fmt(totalBudget - totalSpent);
}

    function calculateSpentByCategory(category) {
      const txs = getJSON(TRANSACTIONS_KEY, []);
      return txs
        .filter((tx) => tx.category === category && tx.type === 'expense')
        .reduce((total, tx) => total + Number(tx.amount || 0), 0);
    }

    renderTransactions();
    renderGoals();
    renderBudgets();
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</body>
</html>
